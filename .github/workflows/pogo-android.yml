name: Pogo Ascent – build & test

# The game under pogo/ is a standalone Gradle build. This workflow runs the JVM tests (game logic, physics, level
# reachability, Android layer under Robolectric) and builds the debug APK. It is NOT triggered automatically – run it from the
# Actions tab or on a pull request that touches pogo/. (It has not been executed by the author: the authoring environment
# could not reach the Android SDK – see pogo/DECISIONS.md D-006.)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pogo/**'
      - '.github/workflows/pogo-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pogo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Core + Android-layer tests
        run: ./gradlew --no-daemon :core:test :android-check:test
      - name: Validate every bundled level (reachability by simulation)
        run: ./gradlew --no-daemon :devtools:validateLevels
      - name: Build debug APK
        run: ./gradlew --no-daemon :android:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pogo-ascent-debug-apk
          path: pogo/android/build/outputs/apk/debug/*.apk
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            pogo/core/build/reports/tests
            pogo/android-check/build/reports/tests
