<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>FLIP ERROR</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060f;
    -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;}
  canvas{display:block;width:100%;height:100%;}
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:#05060f;color:#5ad6ff;font:700 18px/1.6 system-ui,sans-serif;
    letter-spacing:.18em;text-align:center;z-index:10;}
  @media (orientation:portrait){#rotate{display:flex;}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rotate">ROTATE YOUR DEVICE<br><span style="color:#8a7fd6;font-size:13px">FLIP ERROR IS PLAYED IN LANDSCAPE</span></div>
<script src="flip-error.js"></script>
</body>
</html>
