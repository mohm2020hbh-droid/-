<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>FLIP ERROR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap">
<style>
:root{--ink:#05060f;--safe:#2ef0ff;--player:#ffd329;--coin:#ffd93d;--finish:#7cffb2;--muted:#9a8fe6;}
  *{margin:0;padding:0;box-sizing:border-box;}
  [hidden]{display:none!important;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060f;
    -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;}
  canvas{display:block;width:100%;height:100%;}
  /* Everything the game draws lives inside one positioned box. The screens and
     the rotate gate are absolute at inset:0, and without a positioned parent
     they resolve against the viewport instead - which is fine in a bare page and
     wrong inside a host that pads the root for a phone's safe areas. */
  #stage{position:relative;width:100%;height:100%;background:#05060f;}
  /* Shown by script only, and only on a screen that really is portrait.
     A CSS media query here would measure the frame, not the device. */
  #rotate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;padding:0 16px;text-align:center;
    background:#05060f;color:#5ad6ff;font:700 18px/1.6 'Chakra Petch',system-ui,sans-serif;
    letter-spacing:.18em;z-index:10;}
  #rotate span{color:#8a7fd6;font-size:13px;}

  /* ---- screens: menus are DOM so the text is real text ------------------ */
  .screen{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;gap:10px;
    padding:14px clamp(14px,4vw,34px);overflow-y:auto;overscroll-behavior:contain;
    background:radial-gradient(120% 90% at 50% -10%,#1a1140 0%,var(--ink) 62%);
    font-family:'Chakra Petch',system-ui,sans-serif;color:#eef0ff;-webkit-tap-highlight-color:transparent;}
  .screen .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:0 0 auto;}
  .screen h1{margin:0;font:800 clamp(18px,5vw,30px)/1 'Chakra Petch',system-ui,sans-serif;
    letter-spacing:.20em;color:var(--player);text-shadow:0 0 18px rgba(255,211,41,.55);}
  .screen h2{margin:0 0 4px;font:800 clamp(18px,5.5vw,30px)/1.1 'Chakra Petch',system-ui,sans-serif;
    letter-spacing:.16em;color:var(--finish);text-shadow:0 0 20px rgba(124,255,178,.5);text-align:center;}
  .coins{font:700 clamp(13px,3.6vw,18px)/1 'Chakra Petch',system-ui,sans-serif;letter-spacing:.12em;
    color:var(--coin);text-shadow:0 0 14px rgba(255,217,61,.5);white-space:nowrap;}
  .screen button{font-family:'Chakra Petch',system-ui,sans-serif;cursor:pointer;border-radius:12px;}
  .screen button:focus-visible{outline:2px solid var(--coin);outline-offset:3px;}

  .cards{display:flex;gap:10px;flex-wrap:wrap;align-content:flex-start;}
  /* A world's own banner, painted in that world's own three colours. It breaks
     the flex row so every world starts on a fresh line, which is what makes the
     level list read as two places rather than one long list. */
  .world{flex:1 0 100%;display:flex;align-items:baseline;gap:12px;margin:6px 0 2px;
    padding:9px 14px;border-radius:12px;border:2px solid var(--w1);
    background:linear-gradient(100deg,color-mix(in srgb,var(--w1) 22%,transparent),
      color-mix(in srgb,var(--w2) 18%,transparent) 55%,transparent);}
  .world .wn{font:800 clamp(13px,3.4vw,17px)/1 'Chakra Petch',system-ui,sans-serif;
    letter-spacing:.20em;color:var(--w2);}
  .world .wt{font:700 11px/1 'Chakra Petch',system-ui,sans-serif;letter-spacing:.24em;color:var(--w3);}
  .world.far{opacity:.45;filter:grayscale(.5);}
  /* The same banner on the reward screen, where it is the payoff rather than a
     heading: centred, and it glows because arriving somewhere should. */
  .world.crossing{flex:0 0 auto;flex-direction:column;align-items:center;gap:3px;text-align:center;
    box-shadow:0 0 26px color-mix(in srgb,var(--w2) 34%,transparent);}
  .card{flex:1 1 150px;min-width:132px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;
    padding:12px 14px;background:linear-gradient(160deg,rgba(46,240,255,.10),rgba(176,123,255,.07));
    border:2px solid rgba(46,240,255,.45);color:#eef0ff;text-align:left;transition:transform .12s ease;}
  .card:hover:not(:disabled){transform:translateY(-2px);border-color:var(--safe);}
  .card:disabled{opacity:.42;cursor:not-allowed;border-color:#3a3a5e;}
  .card .num{font:800 clamp(14px,3.8vw,19px)/1 'Chakra Petch',system-ui,sans-serif;letter-spacing:.14em;}
  .card .nm{font:600 11px/1.3 'Chakra Petch',system-ui,sans-serif;letter-spacing:.10em;color:var(--muted);}
  .card .state{font:700 10px/1 'Chakra Petch',system-ui,sans-serif;letter-spacing:.18em;margin-top:2px;}
  .s-complete{color:var(--finish);} .s-unlocked{color:var(--safe);}
  .s-locked,.s-soon{color:#6a6a9a;}
  .card .stars{margin-top:4px;letter-spacing:.14em;font-size:15px;color:#3b3b60;}
  .card .stars b.on{color:var(--coin);text-shadow:0 0 10px rgba(255,217,61,.7);}

  .wide{width:100%;padding:13px;border:2px solid var(--player);background:rgba(255,211,41,.10);
    color:var(--player);font-weight:800;letter-spacing:.20em;font-size:clamp(12px,3.4vw,15px);flex:0 0 auto;}
  .wide.go{border-color:var(--finish);background:rgba(124,255,178,.13);color:var(--finish);}
  .wide.ghost{border-color:#43436b;background:transparent;color:var(--muted);}
  .hint{margin:0;text-align:center;font:600 10px/1.5 'Chakra Petch',system-ui,sans-serif;
    letter-spacing:.14em;color:#5a5a86;text-transform:uppercase;flex:0 0 auto;}

  .back{padding:8px 14px;border:2px solid #43436b;background:transparent;color:var(--muted);
    font-weight:700;letter-spacing:.16em;font-size:12px;}
  .tabs{display:flex;gap:7px;flex-wrap:wrap;flex:0 0 auto;}
  .tab{padding:8px 13px;border:2px solid #2c2c4c;background:transparent;color:var(--muted);
    font-weight:700;letter-spacing:.14em;font-size:11px;}
  .tab.on{border-color:var(--safe);color:var(--safe);background:rgba(46,240,255,.10);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;
    align-content:flex-start;}
  .item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;
    border:2px solid #24243f;border-radius:14px;background:rgba(12,14,30,.72);}
  .item.worn{border-color:var(--finish);box-shadow:0 0 18px rgba(124,255,178,.16) inset;}
  .item .prev{width:74px;height:74px;}
  .item .nm{font:700 10px/1 'Chakra Petch',system-ui,sans-serif;letter-spacing:.14em;color:#c9cbe8;}
  .buy{padding:7px 12px;border:2px solid var(--coin);background:rgba(255,217,61,.12);
    color:var(--coin);font-weight:800;letter-spacing:.10em;font-size:11px;}
  .buy.equip{border-color:var(--safe);background:rgba(46,240,255,.12);color:var(--safe);}
  .tag{font:700 10px/1 'Chakra Petch',system-ui,sans-serif;letter-spacing:.14em;padding:7px 4px;}
  .tag.worn{color:var(--finish);} .tag.short{color:#5c5c82;}

  #reward{justify-content:center;align-items:center;}
  #reward .panel{width:min(380px,100%);display:flex;flex-direction:column;gap:9px;}
  .rows{display:flex;flex-direction:column;gap:5px;margin-bottom:4px;}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 12px;
    border:1px solid #23233d;border-radius:9px;font:600 11px/1 'Chakra Petch',system-ui,sans-serif;
    letter-spacing:.14em;color:var(--muted);}
  .row b{font-size:14px;color:#eef0ff;font-variant-numeric:tabular-nums;}
  .row.new{border-color:rgba(46,240,255,.4);} .row.new b{color:var(--safe);}
  .row.total{border-color:rgba(255,217,61,.55);} .row.total b{color:var(--coin);}

  #back{position:absolute;top:0;left:0;z-index:6;margin:8px;padding:6px 13px;border-radius:11px;
    border:2px solid rgba(138,127,214,.5);background:rgba(5,6,15,.72);color:var(--muted);
    font:700 15px/1 'Chakra Petch',system-ui,sans-serif;cursor:pointer;}
  #back:hover{color:var(--player);border-color:var(--player);}
  .screen{justify-content:safe center;}
  .screen > *{width:min(820px,100%);margin-left:auto;margin-right:auto;}

  #modal{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;
    padding:16px;background:rgba(3,4,12,.82);font-family:'Chakra Petch',system-ui,sans-serif;}
  #modal .sheet{width:min(360px,100%);display:flex;flex-direction:column;gap:9px;align-items:stretch;
    padding:18px;border:2px solid rgba(46,240,255,.45);border-radius:18px;
    background:radial-gradient(120% 120% at 50% 0%,#191048 0%,#080a1c 70%);}
  #modal h3{margin:0 0 2px;text-align:center;letter-spacing:.14em;color:var(--coin);
    font:800 clamp(14px,4vw,18px)/1.3 'Chakra Petch',system-ui,sans-serif;}
  #modal .prev.big{width:110px;height:110px;align-self:center;}
  #modal .pair{display:flex;gap:9px;}
  #modal .pair .wide{flex:1;}
  .rowbtns{display:flex;gap:9px;flex:0 0 auto;}
  .rowbtns .wide{flex:1;}
  .row.set{padding:10px 14px;}
  .row.set span{font-size:11px;}
  .sw{width:48px;height:26px;border-radius:14px;border:2px solid #3a3a5e;background:#12142c;
    position:relative;padding:0;cursor:pointer;flex:0 0 auto;}
  .sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:#5a5a86;transition:left .14s ease,background .14s ease;}
  .sw.on{border-color:var(--safe);background:rgba(46,240,255,.16);}
  .sw.on i{left:24px;background:var(--safe);}
  .langs{display:flex;gap:6px;}
  .lang{padding:6px 11px;border:2px solid #2c2c4c;background:transparent;color:var(--muted);
    font-weight:700;font-size:11px;letter-spacing:.08em;border-radius:9px;cursor:pointer;}
  .lang.on{border-color:var(--coin);color:var(--coin);background:rgba(255,217,61,.12);}
  .wide.danger{border-color:#ff3b6b;background:rgba(255,59,107,.12);color:#ff7d9c;}
  /* Arabic joins its letters; spacing them apart breaks the words. */
  [dir=rtl] .screen,[dir=rtl] #modal{letter-spacing:normal;}
  [dir=rtl] .screen h1,[dir=rtl] .screen h2,[dir=rtl] .card .num,[dir=rtl] .card .state,
  [dir=rtl] .wide,[dir=rtl] .tab,[dir=rtl] .buy,[dir=rtl] .tag,[dir=rtl] .row,
  [dir=rtl] .hint,[dir=rtl] .back,[dir=rtl] #modal h3{letter-spacing:normal;}
  [dir=rtl] .card{text-align:right;align-items:flex-end;}

  .tag-line{margin:0;text-align:center;font:600 10px/1.5 'Chakra Petch',system-ui,sans-serif;
    letter-spacing:.14em;color:#5a5a86;text-transform:uppercase;}
  .home{display:flex;flex-direction:column;gap:9px;}
  .wide.big{padding:18px;font-size:clamp(15px,4.4vw,20px);letter-spacing:.26em;}
  #escape{appearance:none;background:none;border:0;margin-top:10px;cursor:pointer;
    color:#6a6a9a;font:600 12px/1.6 'Chakra Petch',system-ui,sans-serif;
    letter-spacing:.14em;text-decoration:underline;text-underline-offset:4px;}
  #escape:hover,#escape:focus-visible{color:#ffc93c;outline:none;}
</style>
</head>
<body>
<div id="stage">
<canvas id="c"></canvas>
  <button id="back" type="button" aria-label="Back to levels" hidden>&lsaquo;</button>
  <div id="menu" class="screen"></div>
  <div id="shop" class="screen" hidden></div>
  <div id="reward" class="screen" hidden></div>
  <div id="settings" class="screen" hidden></div>
  <div id="modal" hidden></div>

<div id="rotate" hidden>
  ROTATE YOUR DEVICE
  <span>FLIP ERROR IS PLAYED IN LANDSCAPE</span>
  <button id="escape" type="button" hidden>PLAY IN PORTRAIT ANYWAY</button>
</div>
</div>
<script src="flip-error.js"></script>
</body>
</html>
